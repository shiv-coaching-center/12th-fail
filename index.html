<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="12th Fail - Offline-first learning app">
  <meta name="application-name" content="12th Fail">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>12th Fail</title>
</head>
<body>
  <main class="shell">
    <div class="brand-mark" aria-hidden="true">F</div>
    <p class="eyebrow">LEARN • PRACTICE • IMPROVE</p>
    <h1>12th Fail</h1>
    <p class="subtitle">आपकी पढ़ाई, अब ऑफलाइन भी।</p>
    <div class="status-card" role="status" aria-live="polite">
      <span class="status-dot" id="connection-dot"></span>
      <span id="connection-status">ऐप तैयार हो रहा है…</span>
    </div>
    <p class="phase-note">नई शुरुआत। ऐप का अगला हिस्सा तैयार किया जा रहा है।</p>
    <section class="update-card" id="update-card" hidden aria-live="polite">
      <p>12th Fail का नया अपडेट उपलब्ध है।</p>
      <button id="update-button" type="button">अपडेट करें</button>
    </section>
    <p class="version">PWA FOUNDATION · v0.2.1</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
