name: Deploy 12th Fail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate JavaScript, manifest and icon
        run: |
          node --check math-engine.js
          node --check app.js
          node tests/math-engine.test.js
          node tests/algebra.test.js
          python -m json.tool manifest.json > /dev/null
          python -c "import xml.etree.ElementTree as ET; ET.parse('icons/brand-icon.svg')"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
